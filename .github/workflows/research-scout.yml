name: MFTL Autonomous Research

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mftl-autonomous-research
  cancel-in-progress: false

jobs:
  scout:
    name: Scout / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - myth-ritual-transmission
          - sacred-place-legend
          - prophecy-apocalyptic
          - pseudoarchaeology-pseudohistory
          - conspiracy-narrative
          - urban-legend-rumor
          - supernatural-claim
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Discover shortlist
        env:
          RESEARCH_SCOUT_LANE: ${{ matrix.lane }}
          RESEARCH_SCOUT_MAX_NEW: "3"
          RESEARCH_SCOUT_OUTPUT: research-out/${{ matrix.lane }}.json
        run: node scripts/research-scout.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.lane }}
          path: research-out/${{ matrix.lane }}.json

  intake:
    needs: scout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: scout-*
          path: research-out
          merge-multiple: true
      - name: Rank and open top leads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_INTAKE_MAX_NEW: "4"
        run: node scripts/research-intake.mjs

  steward:
    needs: intake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --global npm@11.6.0
      - run: npm install --no-audit --no-fund
      - name: Automatic Steward review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/research-steward.mjs
      - name: Validate staging state
        run: npm run ci
      - name: Commit vetted staging
        run: |
          git config user.name "mftl-steward[bot]"
          git config user.email "mftl-steward[bot]@users.noreply.github.com"
          git add data/candidates apps/web/public/data
          if ! git diff --cached --quiet; then
            git commit -m "research: steward stage vetted leads"
            git push origin HEAD:dev
          fi

  promote:
    needs: steward
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --global npm@11.6.0
      - run: npm install --no-audit --no-fund
      - run: npm run ci
      - name: Promote verified dev to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
