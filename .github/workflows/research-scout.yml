name: MFTL Autonomous Research

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover without writing issues/candidates"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

concurrency:
  group: mftl-autonomous-research
  cancel-in-progress: false

jobs:
  scout:
    name: Scout / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        lane:
          - myth-ritual-transmission
          - sacred-place-legend
          - prophecy-apocalyptic
          - pseudoarchaeology-pseudohistory
          - conspiracy-narrative
          - urban-legend-rumor
          - supernatural-claim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Discover scholarly shortlist
        env:
          RESEARCH_SCOUT_LANE: ${{ matrix.lane }}
          RESEARCH_SCOUT_MAX_NEW: "3"
          RESEARCH_SCOUT_OUTPUT: research-out/${{ matrix.lane }}.json
          RESEARCH_SCOUT_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/research-scout.mjs
      - name: Upload shortlist
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.lane }}
          path: research-out/${{ matrix.lane }}.json
          if-no-files-found: error

  intake:
    name: Rank + deduplicate intake
    needs: scout
    if: ${{ always() && needs.scout.result != 'cancelled' && inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Download all scout shortlists
        uses: actions/download-artifact@v4
        with:
          pattern: scout-*
          path: research-out
          merge-multiple: true
      - name: Open top research leads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_INTAKE_MAX_NEW: "4"
        run: node scripts/research-intake.mjs

  steward:
    name: MFTL Steward / review + stage
    needs: intake
    if: ${{ always() && needs.intake.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --global npm@11.6.0
      - run: npm install --no-audit --no-fund
      - name: Automatic Steward review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/research-steward.mjs
      - name: Rebuild + validate + test
        run: npm run ci
      - name: Commit vetted staging data
        run: |
          git config user.name "mftl-steward[bot]"
          git config user.email "mftl-steward[bot]@users.noreply.github.com"
          git add data/candidates apps/web/public/data
          if git diff --cached --quiet; then
            echo "No staged candidate changes"
          else
            git commit -m "research: steward stage vetted leads"
            git push origin HEAD:main
          fi

  report:
    name: Automation health
    needs: [scout, intake, steward]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Scout: ${{ needs.scout.result }}"
          echo "Intake: ${{ needs.intake.result }}"
          echo "Steward: ${{ needs.steward.result }}"
