name: Research Branch Policy

on:
  create:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-policy.yml'
      - 'docs/BRANCHING.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-branch-policy
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep only main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune
          mapfile -t branches < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}' \
              | sort
          )
          for branch in "${branches[@]}"; do
            case "$branch" in
              main) ;;
              *)
                echo "Deleting noncanonical remote branch: $branch"
                git push origin --delete "$branch"
                ;;
            esac
          done

          mapfile -t remaining < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}' \
              | sort
          )
          printf 'Remaining branches:\n%s\n' "${remaining[*]}"
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = "main"
